{% extends "base.html" %}

{% block content %}
<div class="container-fluid">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Edição de Produto</h2>
        <a href="{{ url_for('produtos') }}" class="btn btn-outline-secondary">
            <i class="bi bi-arrow-left"></i> Voltar
        </a>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-header bg-white">
            <strong>Editar produto</strong>
        </div>
        <div class="card-body">
            <form method="POST">
                <div class="row g-3">

                    <div class="col-md-3">
                        <label class="form-label">Código{% if config.produto_codigo_obrigatorio %} <span class="required-mark">*</span>{% endif %}</label>
                        <input type="text" name="codigo" class="form-control" value="{{ produto.codigo or '' }}">
                    </div>

                    <div class="col-md-5">
                        <label class="form-label">Descrição <span class="required-mark">*</span></label>
                        <input type="text" name="descricao" class="form-control" value="{{ produto.descricao }}" required>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">Família{% if config.produto_familia_obrigatoria %} <span class="required-mark">*</span>{% endif %}</label>
                        <select name="familia_id" class="form-select">
                            <option value="">Selecione</option>
                            {% for familia in familias %}
                            <option value="{{ familia.id }}" {% if produto.familia_id == familia.id %}selected{% endif %}>
                                {{ familia.nome }}
                            </option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="col-md-2">
                        <label class="form-label">Unidade{% if config.produto_unidade_obrigatoria %} <span class="required-mark">*</span>{% endif %}</label>
                        <input type="text" name="unidade" class="form-control" value="{{ produto.unidade or '' }}">
                    </div>

                    <div class="col-md-2">
                        <label class="form-label">Custo{% if config.produto_custo_obrigatorio %} <span class="required-mark">*</span>{% endif %}</label>
                        <input type="number" step="0.01" min="0" name="custo" class="form-control" value="{{ produto.custo or 0 }}">
                    </div>

                    <div class="col-md-2">
                        <label class="form-label">Preço de venda{% if config.produto_preco_venda_obrigatorio %} <span class="required-mark">*</span>{% endif %}</label>
                        <input type="number" step="0.01" min="0" name="preco_venda" class="form-control" value="{{ produto.preco_venda or 0 }}">
                    </div>

                    <div class="col-md-3">
                        <label class="form-label">Estoque atual{% if config.produto_estoque_atual_obrigatorio %} <span class="required-mark">*</span>{% endif %}</label>
                        <input type="number" step="0.01" min="0" name="estoque_atual" class="form-control" value="{{ produto.estoque_atual|format_qty }}">
                    </div>

                    <div class="col-md-3">
                        <label class="form-label">Estoque mínimo{% if config.produto_estoque_minimo_obrigatorio %} <span class="required-mark">*</span>{% endif %}</label>
                        <input type="number" step="0.01" min="0" name="estoque_minimo" class="form-control" value="{{ produto.estoque_minimo|format_qty }}">
                    </div>

                    <div class="col-md-3 d-flex align-items-end">
                        <div class="form-check">
                            <input type="checkbox" name="ativo" class="form-check-input" {% if produto.ativo %}checked{% endif %}>
                            <label class="form-check-label">Ativo</label>
                        </div>
                    </div>

                    <div class="col-md-3 d-flex align-items-end gap-2">
                        <button class="btn btn-dark w-100">
                            <i class="bi bi-save"></i> Salvar
                        </button>
                        <a href="{{ url_for('produtos') }}" class="btn btn-secondary w-100">Cancelar</a>
                    </div>

                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
