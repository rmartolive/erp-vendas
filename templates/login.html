<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Login - ERP Vendas</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        :root {
            --azul-escuro: #3b5998;
            --azul-medio: #8b9dc3;
            --azul-claro: #dfe3ee;
            --cinza: #f7f7f7;
            --branco: #ffffff;
        }

        body {
            background: linear-gradient(135deg, var(--azul-escuro), var(--azul-medio));
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
        }

        .login-card {
            width: 100%;
            max-width: 400px;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            overflow: hidden;
            border: none;
        }

        .card-header {
            background-color: var(--azul-escuro);
            color: white;
            text-align: center;
            font-weight: bold;
            border: none;
        }

        .card-body {
            background: var(--branco);
        }

        .form-control {
            border-radius: 10px;
            border: 1px solid var(--azul-claro);
        }

        .form-control:focus {
            border-color: var(--azul-escuro);
            box-shadow: 0 0 0 0.2rem rgba(59,89,152,0.2);
        }

        .btn-login {
            background-color: var(--azul-escuro);
            color: white;
            border-radius: 10px;
            font-weight: bold;
            transition: 0.2s;
        }

        .btn-login:hover {
            background-color: var(--azul-medio);
        }

        .form-label {
            font-weight: 600;
            color: #2c3e50;
        }

        .alert {
            border-radius: 10px;
        }
    </style>
</head>
<body>

<div class="card login-card">
    <div class="card-header py-3">
        <h4 class="mb-0">
            <i class="bi bi-speedometer2"></i> ERP Vendas
        </h4>
    </div>

    <div class="card-body p-4">

        <!-- ALERTAS -->
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <!-- FORM -->
        <form method="POST">
            <div class="mb-3">
                <label class="form-label">Usuário</label>
                <input type="text" name="username" class="form-control" placeholder="Digite seu usuário" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Senha</label>
                <input type="password" name="password" class="form-control" placeholder="Digite sua senha" required>
            </div>

            <button class="btn btn-login w-100">
                <i class="bi bi-box-arrow-in-right"></i> Entrar
            </button>
        </form>

    </div>
</div>

</body>
</html>
