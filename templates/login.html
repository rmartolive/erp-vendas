<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login - {{ empresa_brand_name or 'ERP Vendas' }}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        :root {
            --azul-escuro: #3b5998;
            --azul-medio: #8b9dc3;
            --azul-claro: #dfe3ee;
            --cinza: #f7f7f7;
            --branco: #ffffff;
        }

        body {
            background: linear-gradient(135deg, var(--azul-escuro), var(--azul-medio));
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            padding: 24px;
        }

        .login-card {
            width: 100%;
            max-width: 430px;
            border-radius: 18px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            overflow: hidden;
            border: none;
        }

        .card-header {
            background-color: var(--azul-escuro);
            color: white;
            text-align: center;
            font-weight: bold;
            border: none;
            padding: 28px 24px 22px;
        }

        .login-brand {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .login-logo {
            width: 86px;
            height: 86px;
            border-radius: 18px;
            object-fit: contain;
            background: rgba(255,255,255,.12);
            padding: 8px;
        }

        .login-title {
            margin: 0;
            font-size: 1.55rem;
            font-weight: 700;
        }

        .login-subtitle {
            margin: 0;
            color: rgba(255,255,255,.85);
            font-size: .95rem;
        }

        .card-body { background: var(--branco); }

        .form-control {
            border-radius: 10px;
            border: 1px solid var(--azul-claro);
        }

        .form-control:focus {
            border-color: var(--azul-escuro);
            box-shadow: 0 0 0 0.2rem rgba(59,89,152,0.2);
        }

        .btn-login {
            background-color: var(--azul-escuro);
            color: white;
            border-radius: 10px;
            font-weight: bold;
            transition: 0.2s;
        }

        .btn-login:hover { background-color: var(--azul-medio); }
        .form-label { font-weight: 600; color: #2c3e50; }
        .alert { border-radius: 10px; }

        .support-link {
            display: inline-flex;
            align-items: center;
            gap: .45rem;
            text-decoration: none;
            color: #6c757d;
            font-weight: 600;
        }

        .support-link:hover { color: #495057; }
        .support-link .bi-whatsapp { color: #25D366; }
    </style>
</head>
<body>

<div class="card login-card">
    <div class="card-header">
        <div class="login-brand">
            {% if empresa_logo_url %}
            <img src="{{ empresa_logo_url }}" alt="Logo da empresa" class="login-logo">
            {% endif %}
            <h4 class="login-title">{{ empresa_brand_name or 'ERP Vendas' }}</h4>
        </div>
    </div>

    <div class="card-body p-4">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST">
            <div class="mb-3">
                <label class="form-label">Usuario</label>
                <input type="text" name="username" class="form-control" placeholder="Digite seu usuario" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Senha</label>
                <input type="password" name="password" class="form-control" placeholder="Digite sua senha" required>
            </div>

            <button class="btn btn-login w-100 mb-3">
                <i class="bi bi-box-arrow-in-right"></i> Entrar
            </button>
        </form>

        <div class="text-center">
            <a href="{{ empresa_support_url or 'https://wa.me/5521980912630' }}" target="_blank" rel="noopener noreferrer" class="support-link">
                <i class="bi bi-whatsapp"></i> Suporte via WhatsApp
            </a>
        </div>
    </div>
</div>

</body>
</html>
